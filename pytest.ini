# Файл нужен для создания маркеров и дефолтных опций


[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*


markers =
    smoke: быстрые проверки основной функциональности
    regression: полный регрессионный прогон
    e2e: сквозные сценарии

addopts = -v --strict-markers --tb=short
