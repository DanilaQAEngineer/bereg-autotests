# Файл нужен для создания маркеров и дефолтных опций


[pytest]
testpaths = tests
# testpaths = tests — запуск pytest без аргументов (ищет тесты только в tests/)
python_files = test_*.py
python_classes = Test*
python_functions = test_*


markers =
    smoke: быстрые проверки основного функционала
    regression: полный регресс
    e2e: сквозные сценарии

addopts = -v --strict-markers --tb=short
# --strict-markers — если используется маркер, которого нет в списке markers, pytest упадёт с ошибкой (защита от опечаток)
