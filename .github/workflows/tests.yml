# В этом файле описываем workflow


name: Tests run    # Название workflow

on:    # Триггеры — когда запускать
  push:    # Триггеры — когда запускать
    branches: [ main ]
  pull_request:    # Триггеры — когда запускать
    branches: [ main ]
  workflow_dispatch:    # Кнопка запуска вручную из UI GitHub
  schedule:
    # Запуск по расписанию: каждый день в 18:00 по Москве (15:00 UTC)
    - cron: '17 15 * * *'    # 0 -- запуск ровно в 00 минут, 15 -- 15 часов UTC (18 МСК), *** -- каждый день/месяц (если же нужен запуск только в будни, то '1-5' вместо последней '*' указать * * 1-5)

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest    # Виртуалка GitHub на Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4    # Скачивает код в runner

      - name: Setup Python
        uses: actions/setup-python@v5    # Ставит Python 3.12 + кэш pip
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt    # Ставит зависимости

      - name: Run smoke tests
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
        run: pytest -m smoke --headless=true    # Запускает только smoke-тесты в headless (без открытия браузера)

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4    # Сохраняет скриншоты как артефакты
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4    # Сохраняет логи как артефакты
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore